<div class="points-shop">
    <h1>Tienda de Puntos</h1>
    <p>¡Intercambia tus puntos por increíbles premios!</p>

    <div class="shop-items">
        <div class="shop-item" *ngFor="let item of items">
            <img [src]="item.image" alt="{{ item.name }}" class="item-image" />
            <h2> EJEMPLO ITEM</h2>
            <p> DESCRIPCION </p>
            <p><strong> 1000 puntos</strong></p>
            <!-- <button (click)="redeemItem(item)" [disabled]="userPoints < item.points">
                Canjear
            </button> -->
        </div>
    </div>
</div>

<style>
    .points-shop {
        text-align: center;
        margin: 20px;
    }

    .shop-items {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    .shop-item {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        width: 200px;
        text-align: center;
    }

    .item-image {
        width: 100%;
        height: auto;
        border-radius: 8px;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }
</style>
