<div class="register-container">
    <h2>¡Bienvenido a CharlesCasino!</h2>
    <p>Crea tu cuenta para disfrutar de todos los juegos.</p>
  
    <!-- Formulario de registro -->
    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <!-- Usuario -->
      <div class="input-field">
        <i class="material-icons prefix">account_circle</i>
        <input id="username" type="text" formControlName="username" required />
        <label for="username">Usuario</label>
      </div>
  
      <!-- Correo -->
      <div class="input-field">
        <i class="material-icons prefix">email</i>
        <input id="correo" type="email" formControlName="correo" required />
        <label for="correo">Correo</label>
      </div>
  
      <!-- Contraseña -->
      <div class="input-field">
        <i class="material-icons prefix">lock</i>
        <input id="password" type="password" formControlName="password" required />
        <label for="password">Contraseña</label>
      </div>
  
      <!-- Confirmar Contraseña -->
      <div class="input-field">
        <i class="material-icons prefix">lock</i>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" required />
        <label for="confirmPassword">Confirmar Contraseña</label>
      </div>
  
      <!-- Botón de Registro -->
      <button type="submit" class="btn waves-effect waves-light teal darken-3" [disabled]="registerForm.invalid">
        Registrarse
        <i class="material-icons right">send</i>
      </button>
  
      <!-- Mensaje de Error -->
      <p *ngIf="errorMessage" class="red-text">{{ errorMessage }}</p>
    </form>
  
    <!-- Pie de Página -->
    <div class="card-action center-align">
      <a routerLink="/login" class="blue-text text-darken-2">Ya tengo cuenta, Ingresar</a>
    </div>
  </div>
