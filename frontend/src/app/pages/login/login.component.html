<div class="container">
  <div class="row">
    <div class="col s12 m8 offset-m2 l6 offset-l3">
      <div class="card">
        <div class="card-content center-align">
          <h4 class="teal-text">🎰 CharlesCasino</h4>
          <span class="card-title">Iniciar Sesión</span>

          <!-- Formulario -->
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <!-- Usuario -->
            <div class="input-field">
              <i class="material-icons prefix">account_circle</i>
              <input id="username" type="text" formControlName="username" required />
              <label for="username">Usuario</label>
            </div>

            <!-- Contraseña -->
            <div class="input-field">
              <i class="material-icons prefix">lock</i>
              <input id="password" type="password" formControlName="password" required />
              <label for="password">Contraseña</label>
            </div>

            <!-- Botón de Ingreso -->
            <button type="submit" class="btn waves-effect waves-light teal darken-3" [disabled]="loginForm.invalid">
              Ingresar
              <i class="material-icons right">send</i>
            </button>

            <!-- Mensaje de Error -->
            <p *ngIf="errorMessage" class="red-text">{{ errorMessage }}</p>
          </form>
        </div>

        <!-- Pie de Página -->
        <div class="card-action center-align">
          <a href="#" class="blue-text text-darken-2">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
    </div>
  </div>
</div>
